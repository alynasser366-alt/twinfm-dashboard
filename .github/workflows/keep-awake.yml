name: keep-awake
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && playwright install --with-deps chromium
      - name: Visit app and wake it if asleep
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          URL = "https://twinfm-snowdon.streamlit.app/"
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              pg.goto(URL, wait_until="domcontentloaded", timeout=90000)
              pg.wait_for_timeout(8000)
              btn = pg.get_by_role("button", name="Yes, get this app back up!")
              if btn.count():
                  print("App was asleep - waking it")
                  btn.first.click()
                  pg.wait_for_timeout(90000)
              else:
                  print("App is awake")
                  pg.wait_for_timeout(20000)
              b.close()
